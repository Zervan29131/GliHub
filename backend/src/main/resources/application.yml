glihub:
  name: GliHub
  version: 3.0.0
  copyrightYear: 2026
  profile: ${GLIHUB_UPLOAD_PATH:../data/uploads}
  addressEnabled: false
  captchaType: math
  aiServiceUrl: ${AI_SERVICE_URL:http://127.0.0.1:8090}
  aiOutputDir: ${AI_OUTPUT_DIR:../ai-service/outputs}
  sampleImageDir: ${SAMPLE_IMAGE_DIR:../../yolov5target-main/data/images}
  modelsDir: ${GLIHUB_MODELS_DIR:../data/models}
  edgeSnapsDir: ${GLIHUB_EDGE_SNAPS_DIR:../data/edge_snaps}
  edgeSharedToken: ${EDGE_SHARED_TOKEN:glihub-edge-shared-token-v3}
  aiTimeoutMs: ${AI_TIMEOUT_MS:35000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000

logging:
  level:
    com.glihub: info
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  threads:
    virtual:
      enabled: true
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/glihub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: GliHubHikariPool
      minimum-idle: 4
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 16
          max-wait: -1ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

token:
  header: Authorization
  secret: ${JWT_SECRET:glihub-v3-industrial-ehs-jwt-hmac-secret-key-2026-secure}
  expireTime: 60

mybatis:
  typeAliasesPackage: com.glihub.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*

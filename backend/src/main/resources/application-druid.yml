# PostgreSQL 数据源与 Druid 连接池配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.postgresql.Driver
    druid:
      # 主库数据源（支持环境变量覆盖）
      master:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/glihub}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
      # 从库数据源（默认关闭）
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true

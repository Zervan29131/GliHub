version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: glihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glihub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/glihub.sql:/docker-entrypoint-initdb.d/01-glihub.sql:ro
      - ./sql/glihub_v2_upgrade.sql:/docker-entrypoint-initdb.d/02-glihub-v2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-glihub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: glihub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: glihub-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8090
      YOLOV5_REPO_DIR: /app/yolov5target-main
      OUTPUT_DIR: /app/ai-service/outputs
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-glihub}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      VLM_BASE_URL: ${VLM_BASE_URL:-http://host.docker.internal:11434/v1}
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
    ports:
      - "${AI_SERVICE_PORT:-8090}:8090"
    volumes:
      - ./yolov5target-main:/app/yolov5target-main:ro
      - ai_outputs:/app/ai-service/outputs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glihub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-glihub}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AI_SERVICE_URL: http://ai-service:8090
      AI_OUTPUT_DIR: /app/ai-outputs
      SAMPLE_IMAGE_DIR: /app/sample-images
      GLIHUB_UPLOAD_PATH: /app/upload
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/upload
      - ai_outputs:/app/ai-outputs:ro
      - ./yolov5target-main/data/images:/app/sample-images:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glihub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"

volumes:
  pg_data:
  redis_data:
  ai_outputs:
  backend_uploads:
